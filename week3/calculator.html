<!DOCTYPE html>
<html>
<head>
<title>CGPA / SGPA Calculator</title>
<style>
  body {
    font-family: Arial, sans-serif;
    max-width: 400px;
    margin: 40px auto;
    padding: 20px;
    background: #f5f5f5;
  }
  h2 {
    text-align: center;
  }
  .row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  input {
    flex: 1;
    padding: 8px;
    font-size: 14px;
  }
  button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    font-size: 15px;
    cursor: pointer;
  }
  #result {
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    margin-top: 15px;
  }
</style>
</head>
<body>

<h2>CGPA / SGPA Calculator</h2>

<div id="rows">
  <div class="row">
    <input type="number" placeholder="Credits" class="credits">
    <input type="number" placeholder="Grade Point" class="grade">
  </div>
  <div class="row">
    <input type="number" placeholder="Credits" class="credits">
    <input type="number" placeholder="Grade Point" class="grade">
  </div>
  <div class="row">
    <input type="number" placeholder="Credits" class="credits">
    <input type="number" placeholder="Grade Point" class="grade">
  </div>
</div>

<button onclick="addRow()">+ Add Subject</button>
<button onclick="calculate()">Calculate</button>

<div id="result"></div>

<script>
  function addRow() {
    const div = document.createElement('div');
    div.className = 'row';
    div.innerHTML = `
      <input type="number" placeholder="Credits" class="credits">
      <input type="number" placeholder="Grade Point" class="grade">
    `;
    document.getElementById('rows').appendChild(div);
  }

  function calculate() {
    const credits = document.querySelectorAll('.credits');
    const grades = document.querySelectorAll('.grade');
    let totalCredits = 0;
    let totalPoints = 0;

    for (let i = 0; i < credits.length; i++) {
      const c = parseFloat(credits[i].value);
      const g = parseFloat(grades[i].value);
      if (!isNaN(c) && !isNaN(g)) {
        totalCredits += c;
        totalPoints += c * g;
      }
    }

    if (totalCredits === 0) {
      document.getElementById('result').textContent = 'Enter valid values';
      return;
    }

    const gpa = totalPoints / totalCredits;
    document.getElementById('result').textContent = 'GPA: ' + gpa.toFixed(2);
  }
</script>

</body>
</html>
