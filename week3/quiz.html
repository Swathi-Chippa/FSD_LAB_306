<!DOCTYPE html>
<html>
<head>
<title>Simple Quiz</title>
<style>
body {
  font-family: Arial, sans-serif;
  max-width: 400px;
  margin: 40px auto;
  padding: 20px;
  background: #f5f5f5;
}

h2 {
  text-align: center;
}

#question {
  font-size: 16px;
  font-weight: bold;
  margin-bottom: 12px;
}

.option {
  display: block;
  width: 100%;
  padding: 10px;
  margin-bottom: 8px;
  font-size: 14px;
  text-align: left;
  cursor: pointer;
  background: white;
  border: 1px solid #ccc;
}

.option.selected {
  background: #cce5ff;
  border-color: #3399ff;
}

.option.correct {
  background: #cdf7d8;
  border-color: green;
}

.option.wrong {
  background: #f7cdcd;
  border-color: red;
}

button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  font-size: 15px;
  cursor: pointer;
}

#result {
  text-align: center;
  font-size: 18px;
  font-weight: bold;
  margin-top: 15px;
}
</style>
</head>
<body>

<h2>Simple Quiz</h2>

<div id="quiz-box">
  <div id="question"></div>
  <div id="options"></div>
</div>

<button onclick="nextQuestion()">Next</button>

<div id="result"></div>

<script>
const questions = [
  {
    q: "What does HTML stand for?",
    options: ["Hyper Trainer Marking Language", "Hyper Text Markup Language", "Hyper Text Marketing Language", "Hyper Text Markup Leveler"],
    answer: 1
  },
  {
    q: "Which language is used to style web pages?",
    options: ["HTML", "JQuery", "CSS", "XML"],
    answer: 2
  },
  {
    q: "Which is not a JavaScript data type?",
    options: ["String", "Boolean", "Float", "Number"],
    answer: 2
  },
  {
    q: "Inside which tag do we put JavaScript code?",
    options: ["<js>", "<javascript>", "<scripting>", "<script>"],
    answer: 3
  },
  {
    q: "How do you write a comment in CSS?",
    options: ["// this is a comment", "<!-- this is a comment -->", "/* this is a comment */", "# this is a comment"],
    answer: 2
  }
];

let current = 0;
let score = 0;
let answered = false;

function loadQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById('question').textContent = (current + 1) + ". " + q.q;

  const optionsDiv = document.getElementById('options');
  optionsDiv.innerHTML = '';

  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt;
    btn.onclick = () => selectOption(i);
    optionsDiv.appendChild(btn);
  });

  document.getElementById('result').textContent = '';
}

function selectOption(i) {
  if (answered) return;
  answered = true;

  const q = questions[current];
  const buttons = document.querySelectorAll('.option');

  buttons[i].classList.add(i === q.answer ? 'correct' : 'wrong');
  buttons[q.answer].classList.add('correct');

  if (i === q.answer) score++;
}

function nextQuestion() {
  if (!answered && current < questions.length) {
    alert('Please select an answer first');
    return;
  }

  current++;

  if (current < questions.length) {
    loadQuestion();
  } else {
    document.getElementById('quiz-box').style.display = 'none';
    document.querySelector('button').style.display = 'none';
    document.getElementById('result').textContent =
      'Quiz finished! Score: ' + score + ' / ' + questions.length;
  }
}

loadQuestion();
</script>
</body>
</html>
